<svg xmlns="http://www.w3.org/2000/svg" width="830" height="300" viewBox="0 0 830 300" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-label="How a photo is checked">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#111216"/></marker></defs>
<rect width="830" height="300" fill="#ffffff"/><rect x="0" y="20" width="146" height="64" rx="16" fill="#f6f6f9" stroke="#e9e9ef"/><text x="73.0" y="48.0" text-anchor="middle" font-size="14" font-weight="600" fill="#111216">Photo</text><text x="73.0" y="67.0" text-anchor="middle" font-size="11.5" fill="#5b5d68">one corn leaf</text><rect x="171" y="20" width="146" height="64" rx="16" fill="#f6f6f9" stroke="#e9e9ef"/><text x="244.0" y="48.0" text-anchor="middle" font-size="14" font-weight="600" fill="#111216">Leaf-only crop</text><text x="244.0" y="67.0" text-anchor="middle" font-size="11.5" fill="#5b5d68">no background shortcut</text><rect x="342" y="20" width="146" height="64" rx="16" fill="#f6f6f9" stroke="#e9e9ef"/><text x="415.0" y="48.0" text-anchor="middle" font-size="14" font-weight="600" fill="#111216">Corn leaf check</text><text x="415.0" y="67.0" text-anchor="middle" font-size="11.5" fill="#5b5d68">4 reference groups</text><rect x="513" y="20" width="146" height="64" rx="16" fill="#111216" stroke="#111216"/><text x="586.0" y="48.0" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">Classifier</text><text x="586.0" y="67.0" text-anchor="middle" font-size="11.5" fill="#c9cad3">two-model ensemble</text><rect x="684" y="20" width="146" height="64" rx="16" fill="#f6f6f9" stroke="#e9e9ef"/><text x="757.0" y="48.0" text-anchor="middle" font-size="14" font-weight="600" fill="#111216">Verdict</text><text x="757.0" y="67.0" text-anchor="middle" font-size="11.5" fill="#5b5d68">with a Grad-CAM heatmap</text><line x1="148" y1="52" x2="167" y2="52" stroke="#111216" stroke-width="1.6" marker-end="url(#a)"/><line x1="319" y1="52" x2="338" y2="52" stroke="#111216" stroke-width="1.6" marker-end="url(#a)"/><line x1="490" y1="52" x2="509" y2="52" stroke="#111216" stroke-width="1.6" marker-end="url(#a)"/><line x1="661" y1="52" x2="680" y2="52" stroke="#111216" stroke-width="1.6" marker-end="url(#a)"/><line x1="415.0" y1="86" x2="415.0" y2="118" stroke="#111216" stroke-width="1.6" marker-end="url(#a)"/><rect x="320" y="120" width="190" height="46" rx="16" fill="#f6f6f9" stroke="#e9e9ef"/><text x="415.0" y="139.0" text-anchor="middle" font-size="14" font-weight="600" fill="#111216">Refused</text><text x="415.0" y="158.0" text-anchor="middle" font-size="11.5" fill="#5b5d68">not a corn leaf, no guess</text><text x="0" y="214" font-size="12.5" font-weight="600" fill="#5b5d68">ON THE WEB</text><rect x="0" y="228" width="260" height="58" rx="16" fill="#f6f6f9" stroke="#e9e9ef"/><text x="130.0" y="253.0" text-anchor="middle" font-size="14" font-weight="600" fill="#111216">Browser</text><text x="130.0" y="272.0" text-anchor="middle" font-size="11.5" fill="#5b5d68">the page and two samples</text><rect x="285" y="228" width="260" height="58" rx="16" fill="#f6f6f9" stroke="#e9e9ef"/><text x="415.0" y="253.0" text-anchor="middle" font-size="14" font-weight="600" fill="#111216">nginx on a VPS</text><text x="415.0" y="272.0" text-anchor="middle" font-size="11.5" fill="#5b5d68">serves the page, forwards /api</text><rect x="570" y="228" width="260" height="58" rx="16" fill="#111216" stroke="#111216"/><text x="700.0" y="253.0" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">Modal</text><text x="700.0" y="272.0" text-anchor="middle" font-size="11.5" fill="#c9cad3">runs the models, sleeps when idle</text><line x1="262" y1="257" x2="281" y2="257" stroke="#111216" stroke-width="1.6" marker-end="url(#a)"/><line x1="547" y1="257" x2="566" y2="257" stroke="#111216" stroke-width="1.6" marker-end="url(#a)"/></svg>
